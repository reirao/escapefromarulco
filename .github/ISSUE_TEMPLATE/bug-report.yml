name: Bug report
description: Report a reproducible gameplay, interface, inventory or interaction problem.
title: "[Bug] "
labels: ["bug", "playtest"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing. Please attach the TXT generated by the in-game **FB** window.
        Do not upload original JA2 data archives.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Briefly describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Select...
        2. Right-click...
        3. Choose...
    validations:
      required: true
  - type: input
    id: frequency
    attributes:
      label: Frequency
      placeholder: Every time / sometimes / once
  - type: textarea
    id: attachments
    attributes:
      label: Feedback TXT, screenshots or save
      description: Drag the generated report and any useful screenshots here.
  - type: checkboxes
    id: legal
    attributes:
      label: Original game data
      options:
        - label: I did not attach original JA2 SLF archives or other copyrighted game data.
          required: true

